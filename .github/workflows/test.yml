name: MorningForge self-test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 运行不变量自检（8/8）
        run: node test/run.mjs
